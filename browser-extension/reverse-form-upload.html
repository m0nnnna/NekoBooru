<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NekoBooru reverse image upload</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #e5e7eb;
      font: 14px system-ui, sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 20px;
      background: #1f2937;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      color: #93c5fd;
      font-size: 16px;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Uploading image</h1>
    <p id="status">Preparing image...</p>
    <form id="upload-form" method="post" enctype="multipart/form-data">
      <input id="search-image" type="file" hidden />
    </form>
  </main>
  <script src="reverse-upload-store.js"></script>
  <script src="reverse-form-upload.js"></script>
</body>
</html>
