<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NekoBooru Google Lens upload</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #e5e7eb;
      font: 14px system-ui, sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 20px;
      background: #1f2937;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      color: #93c5fd;
      font-size: 16px;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Uploading to Google Lens</h1>
    <p id="status">Preparing image...</p>
    <form
      id="lens-form"
      action="https://images.google.com/searchbyimage/upload"
      method="post"
      enctype="multipart/form-data"
    >
      <input id="encoded-image" type="file" name="encoded_image" hidden />
      <input type="hidden" name="image_content" value="" />
      <input type="hidden" name="filename" value="nekobooru-search.png" />
      <input type="hidden" name="sbisrc" value="cr_1" />
    </form>
  </main>
  <script src="google-lens-upload.js"></script>
</body>
</html>
