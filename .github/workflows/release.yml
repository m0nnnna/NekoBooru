name: Build release artifacts

# Push a tag like v1.2.0 to build everything and publish a GitHub release with
# the artifacts attached. You can also run it manually (Actions tab) to build
# the artifacts without creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifact names (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve a single version string shared by every job.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="dev"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  # ---------------------------------------------------------------------------
  # Browser extension (zip). Version comes from manifest.json.
  # ---------------------------------------------------------------------------
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package extension
        run: |
          chmod +x build-extension.sh
          ./build-extension.sh
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: dist/nekobooru-extension-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: tarball + .deb
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build Ubuntu package + .deb
        run: |
          chmod +x build-ubuntu.sh build-deb.sh
          ./build-ubuntu.sh "$VERSION"
          ( cd dist && tar -czf "nekobooru-ubuntu-$VERSION.tar.gz" nekobooru-ubuntu )
          ./build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/nekobooru-ubuntu-*.tar.gz
            dist/nekobooru_*_all.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: zip
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows binary
        shell: cmd
        # build-windows.bat was removed in favour of the standalone PyInstaller
        # build; redirect stdin from NUL so its trailing `pause` can't hang CI.
        run: call build-binary.bat < nul
      - name: Zip Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/nekobooru-binary/*" `
            -DestinationPath "dist/nekobooru-windows-$env:VERSION.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/nekobooru-windows-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect every artifact and attach to the release (tag pushes only).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [extension, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
