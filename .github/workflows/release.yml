name: Build release artifacts

# Push a tag like v1.2.0 to build everything and publish a GitHub release with
# the artifacts attached. You can also run it manually (Actions tab) to build
# the artifacts without creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifact names (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve a single version string shared by every job.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="dev"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  # ---------------------------------------------------------------------------
  # Browser extension (zip). Version comes from manifest.json.
  # ---------------------------------------------------------------------------
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package extension
        run: |
          chmod +x build-extension.sh
          ./build-extension.sh
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: dist/nekobooru-extension-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: release APK, signed with the same debug-style key the app builds
  # with locally (see android/app/build.gradle.kts).
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      # gradle-wrapper.jar is deliberately not committed (see .gitignore) -
      # provision Gradle directly instead of relying on ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate the debug-style signing key
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease
      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nekobooru-android-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/nekobooru-android-*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect every artifact and attach to the release (tag pushes only). The
  # main app runs from source now - only the browser extension and the
  # Android app ship as prebuilt artifacts.
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [extension, android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
